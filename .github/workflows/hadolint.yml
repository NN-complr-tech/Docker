name: hadolint

on:
  push:
    paths:
      - "**/Dockerfile*"
      - "**/*.Dockerfile"
      - ".hadolint.yaml"
      - ".github/workflows/hadolint.yml"
  pull_request:
    paths:
      - "**/Dockerfile*"
      - "**/*.Dockerfile"
      - ".hadolint.yaml"
      - ".github/workflows/hadolint.yml"

jobs:
  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          git ls-files \
            | { grep -E '(^|/)(Dockerfile(\..*)?|.*\.Dockerfile)$' || true; } \
            | xargs -r docker run --rm -v "${PWD}:/workdir" -w /workdir \
                hadolint/hadolint:v2.12.0 hadolint --config .hadolint.yaml
